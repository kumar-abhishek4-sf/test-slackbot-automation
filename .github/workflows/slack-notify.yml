name: Slack Notifications

on:
  issues:
    types:
      - opened
      - closed
      - reopened

  issue_comment:
    types:
      - created
      - edited
      - deleted

jobs:
  notify:
    runs-on: ubuntu-latest
    if: >-
      !(github.event_name == 'issue_comment' &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'COLLABORATOR'))
    concurrency:
      group: slack-notify-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - name: Truncate fields
        id: truncate
        continue-on-error: true
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            RAW="$COMMENT_BODY"
          else
            RAW="$ISSUE_BODY"
          fi
          TRUNCATED=$(echo "$RAW" | tr '\n' ' ' | tr -s ' ' | cut -d' ' -f1-10 || echo "")
          echo "body=${TRUNCATED:-}" >> $GITHUB_OUTPUT
          TRUNCATED_TITLE=$(echo "$ISSUE_TITLE" | tr '\n' ' ' | tr -s ' ' | cut -d' ' -f1-10 || echo "")
          echo "title=${TRUNCATED_TITLE:-}" >> $GITHUB_OUTPUT

      - name: Restore Slack thread TS
        id: cache_restore
        uses: actions/cache/restore@v4
        with:
          path: .slack-thread
          key: slack-thread-${{ github.event.issue.number }}

      - name: Read cached thread TS
        id: thread
        run: |
          if [ -f .slack-thread/ts ]; then
            echo "ts=$(cat .slack-thread/ts)" >> $GITHUB_OUTPUT
          else
            echo "ts=" >> $GITHUB_OUTPUT
          fi

      - name: Post new Slack message
        id: slack_new
        if: steps.thread.outputs.ts == ''
        uses: slackapi/slack-github-action@v2.0.0
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          method: chat.postMessage
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": "*GitHub Issue Update* on `${{ github.repository }}`",
              "attachments": [
                {
                  "color": "${{ github.event.action == 'closed' && '#d73a4a' || github.event.action == 'opened' && '#36a64f' || '#e8a404' }}",
                  "fields": [
                    {
                      "title": "Action",
                      "value": "${{ github.event_name == 'issue_comment' && 'New Comment' || github.event.action }}",
                      "short": true
                    },
                    {
                      "title": "Triggered by",
                      "value": ${{ toJSON(github.actor) }},
                      "short": true
                    },
                    {
                      "title": "Title",
                      "value": ${{ toJSON(steps.truncate.outputs.title) }},
                      "short": false
                    },
                    {
                      "title": "Body",
                      "value": ${{ toJSON(steps.truncate.outputs.body) }},
                      "short": false
                    },
                    {
                      "title": "Link",
                      "value": "${{ github.event_name == 'issue_comment' && github.event.comment.html_url || github.event.issue.html_url }}",
                      "short": false
                    }
                  ]
                }
              ]
            }

      - name: Reply to existing Slack thread
        if: steps.thread.outputs.ts != ''
        uses: slackapi/slack-github-action@v2.0.0
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          method: chat.postMessage
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "thread_ts": "${{ steps.thread.outputs.ts }}",
              "reply_broadcast": true,
              "text": "*GitHub Issue Update* on `${{ github.repository }}`",
              "attachments": [
                {
                  "color": "${{ github.event.action == 'closed' && '#d73a4a' || github.event.action == 'opened' && '#36a64f' || '#e8a404' }}",
                  "fields": [
                    {
                      "title": "Action",
                      "value": "${{ github.event_name == 'issue_comment' && 'New Comment' || github.event.action }}",
                      "short": true
                    },
                    {
                      "title": "Triggered by",
                      "value": ${{ toJSON(github.actor) }},
                      "short": true
                    },
                    {
                      "title": "Title",
                      "value": ${{ toJSON(steps.truncate.outputs.title) }},
                      "short": false
                    },
                    {
                      "title": "Body",
                      "value": ${{ toJSON(steps.truncate.outputs.body) }},
                      "short": false
                    },
                    {
                      "title": "Link",
                      "value": "${{ github.event_name == 'issue_comment' && github.event.comment.html_url || github.event.issue.html_url }}",
                      "short": false
                    }
                  ]
                }
              ]
            }

      - name: Save thread TS to file
        if: steps.thread.outputs.ts == '' && steps.slack_new.outcome == 'success'
        run: |
          mkdir -p .slack-thread
          echo '${{ steps.slack_new.outputs.response }}' | jq -r '.ts' > .slack-thread/ts

      - name: Cache thread TS
        if: steps.thread.outputs.ts == '' && steps.slack_new.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .slack-thread
          key: slack-thread-${{ github.event.issue.number }}
