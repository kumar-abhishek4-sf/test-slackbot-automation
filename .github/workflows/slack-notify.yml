name: Slack Notifications

on:
  issues:
    types:
      - opened
      - closed
      - reopened

  issue_comment:
    types:
      - created
      - edited
      - deleted

jobs:
  notify:
    runs-on: ubuntu-latest
    if: >-
      !(github.event_name == 'issue_comment' &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'COLLABORATOR'))
    concurrency:
      group: slack-notify-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - name: Restore Slack thread TS
        uses: actions/cache/restore@v4
        with:
          path: .slack-thread
          key: slack-thread-${{ github.event.issue.number }}

      - name: Post to Slack
        id: slack
        env:
          BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            ACTION_LABEL="New Comment"
            COLOR="#e8a404"
            RAW_BODY="$COMMENT_BODY"
            LINK="$COMMENT_URL"
          elif [ "$EVENT_ACTION" = "closed" ]; then
            ACTION_LABEL="closed"
            COLOR="#d73a4a"
            RAW_BODY="$ISSUE_BODY"
            LINK="$ISSUE_URL"
          elif [ "$EVENT_ACTION" = "opened" ]; then
            ACTION_LABEL="opened"
            COLOR="#36a64f"
            RAW_BODY="$ISSUE_BODY"
            LINK="$ISSUE_URL"
          else
            ACTION_LABEL="$EVENT_ACTION"
            COLOR="#e8a404"
            RAW_BODY="$ISSUE_BODY"
            LINK="$ISSUE_URL"
          fi

          TITLE=$(echo "$ISSUE_TITLE" | tr '\n' ' ' | tr -s ' ' | cut -d' ' -f1-10)
          BODY=$(echo "$RAW_BODY"   | tr '\n' ' ' | tr -s ' ' | cut -d' ' -f1-10)

          THREAD_TS=""
          if [ -f .slack-thread/ts ]; then
            THREAD_TS=$(cat .slack-thread/ts)
          fi

          PAYLOAD=$(jq -n \
            --arg channel    "$CHANNEL_ID" \
            --arg repo       "$REPOSITORY" \
            --arg color      "$COLOR" \
            --arg action     "$ACTION_LABEL" \
            --arg actor      "$ACTOR" \
            --arg title      "$TITLE" \
            --arg body       "$BODY" \
            --arg link       "$LINK" \
            --arg thread_ts  "$THREAD_TS" \
            '{
              channel: $channel,
              text: ("*GitHub Issue Update* on `" + $repo + "`"),
              attachments: [{
                color: $color,
                fields: [
                  {title: "Action",       value: $action, short: true},
                  {title: "Triggered by", value: $actor,  short: true},
                  {title: "Title",        value: $title,  short: false},
                  {title: "Body",         value: $body,   short: false},
                  {title: "Link",         value: $link,   short: false}
                ]
              }]
            } + (if $thread_ts != "" then {thread_ts: $thread_ts, reply_broadcast: true} else {} end)')

          RESPONSE=$(curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "$RESPONSE"
          echo "ok=$(echo "$RESPONSE" | jq -r '.ok')"         >> $GITHUB_OUTPUT
          echo "ts=$(echo "$RESPONSE" | jq -r '.ts // empty')" >> $GITHUB_OUTPUT

      - name: Cache thread TS for future events
        if: steps.slack.outputs.ok == 'true' && steps.slack.outputs.ts != '' && !hashFiles('.slack-thread/ts')
        run: |
          mkdir -p .slack-thread
          echo "${{ steps.slack.outputs.ts }}" > .slack-thread/ts

      - name: Save thread TS to cache
        if: steps.slack.outputs.ok == 'true' && steps.slack.outputs.ts != '' && !hashFiles('.slack-thread/ts')
        uses: actions/cache/save@v4
        with:
          path: .slack-thread
          key: slack-thread-${{ github.event.issue.number }}
